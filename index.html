      </div>
      <div style="display:flex;gap:5px;margin-bottom:12px">${dots()}</div>
      <div style="color:rgba(255,255,255,.8);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px">${EXP.icon} Fase ${G.ph+1}/${EXP.phases.length} · ${jq2(PLAYER)}</div>
      <div style="color:white;font-size:18px;font-weight:800;font-family:'Fraunces',serif">${ph.title}</div>
      <div style="color:rgba(255,255,255,.7);font-size:12px">${ph.sub}</div>
    </div>
    <div style="padding:16px 18px;max-width:680px;margin:0 auto;width:100%">
      <div style="border-radius:14px;overflow:hidden;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.1)">
        <img src="data:image/svg+xml;base64,${btoa(unescape(encodeURIComponent(ph.svg)))}" style="width:100%;display:block;border-radius:14px"/>
      </div>
      <div class="card" style="margin-bottom:14px;font-size:14px;line-height:1.65;color:#333">${ph.nar}</div>
      <div class="card">
        <div style="font-size:13px;font-weight:800;color:#424242;margin-bottom:12px;text-transform:uppercase;letter-spacing:.4px">📋 Decisão de Campo</div>
        <div style="font-size:15px;font-weight:700;color:#1a1a1a;margin-bottom:14px;line-height:1.5">${ph.q}</div>
        ${choices}
      </div>
    </div>
  </div>`);
}

window.sel=function(di){
  if(G.ch!==null)return;
  G.ch=di; G.chOrig=G.shuffled[G.ph][di];
  G.score+=EXP.phases[G.ph].cs[G.chOrig].p;
  renderFeedback();
};

function renderFeedback(){
  const ph=EXP.phases[G.ph];
  const c=ph.cs[G.chOrig];
  const order=G.shuffled[G.ph];
  const elapsed=Math.floor((Date.now()-G.startTime)/1000);
  const mImg = c.p===10 ? MATIAS_WINK_IMG : c.p===5 ? MATIAS_IMG : MATIAS_SAD_IMG;
  const mMsg = c.p===10
    ? ['Muito bem! Exatamente isso.','Correto! Bom raciocínio.','Perfeito! É isso.','Excelente decisão de campo!'][G.ph%4]
    : c.p===5
    ? ['Parcialmente certo. Veja o detalhe.','Quase! Faltou precisão.','Na direção certa, mas incompleto.'][G.ph%3]
    : ['Não desta vez. Aprenda e avance.','Errado. Veja a explicação.','Cuidado! A ciência é precisa.'][G.ph%3];

  const choiceBtns=order.map((origIdx,di)=>{
    const ci=ph.cs[origIdx];
    const lbl=String.fromCharCode(65+di);
    let bg='#fafafa',bc='#e0e0e0',co='#9e9e9e';
    if(ci.tp==='c'){bg='#e8f5e9';bc='#2e7d32';co='#1b5e20';}
    else if(di===G.ch){bg='#ffebee';bc='#c62828';co='#b71c1c';}

      ${ci.tp==='c'?'✅ ':di===G.ch?'❌ ':''}<span style="opacity:${ci.tp==='c'||di===G.ch?1:.5}">${jq2(ci.t)}</span>
    </div>`;
  }).join('');
  const isLast=G.ph===EXP.phases.length-1;

  R(`<div class="sc" style="background:#fafafa">
    <div style="background:${EXP.color};padding:16px 18px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <button class="btn" onclick="renderHub()" style="background:rgba(255,255,255,.2);color:white;padding:7px 14px;font-size:13px">← Hub</button>
        <div style="color:rgba(255,255,255,.95);font-size:13px;font-weight:700">⏱️ ${fmtTime(elapsed)} &nbsp;|&nbsp; ⭐ ${G.score} &nbsp;|&nbsp; 🎯 meta 50</div>
      </div>
      <div style="display:flex;gap:5px;margin-bottom:10px">${dots()}</div>
      <div style="display:inline-block;background:rgba(255,255,255,.22);color:white;border-radius:20px;padding:5px 16px;font-size:15px;font-weight:800">
        ${c.e} ${c.p>=0?'+':'−'}${Math.abs(c.p)} pontos
      </div>
    </div>
    <div style="padding:16px 18px;max-width:680px;margin:0 auto;width:100%">
      <div style="display:flex;gap:12px;align-items:flex-end;margin-bottom:14px">
        <img src="${mImg}" style="width:60px;flex-shrink:0;filter:drop-shadow(0 2px 8px rgba(0,0,0,.2))"/>
        <div class="bubble sUp" style="background:#e8f5e9;border-radius:18px 18px 18px 4px;flex:1">
          <div style="font-size:11px;color:#9e9e9e;margin-bottom:4px;font-weight:700">Jaçanã</div>
          <div style="font-size:13px;font-weight:700;color:${sCol(c.p)};margin-bottom:6px">${mMsg}</div>
          <p style="font-size:13.5px;line-height:1.6;color:#333">${jq2(c.fb)}</p>
        </div>
      </div>
      <div class="card" style="margin-bottom:14px">${choiceBtns}</div>
      <div style="text-align:center">
        <button class="btn" onclick="next()" style="background:${EXP.color};color:white;padding:14px 40px;font-size:16px;border-radius:14px">
          ${isLast?'Ver Resultado 🎯':'Próxima Fase →'}
        </button>
      </div>
    </div>
  </div>`);
}

        <input id="rankName" class="txt-in" type="text" placeholder="Seu nome..." maxlength="30" value="${jq2(PLAYER)}" style="margin-bottom:12px"/>
        <div style="display:flex;gap:10px">
          <button id="savebtn" class="btn" onclick="doSaveRank()" style="background:#15803d;color:#fff;flex:1;padding:13px">🌍 Salvar</button>
          <button class="btn" onclick="skipRank()" style="background:#fff;color:#166534;border:2px solid #bbf7d0;padding:13px">Pular</button>
        </div>
        ${FB_URL?'':`<div style="margin-top:10px;color:#4b5d55;font-size:11px">⚠️ Ranking global não configurado — salvando localmente.</div>`}
      </div>
    </div>
  </div>`);
  const inp=$('rankName');
  if(inp){inp.focus();inp.addEventListener('keydown',e=>{if(e.key==='Enter')doSaveRank()})}
}

function renderEnding(saved){
  const pct=Math.round(G.score/G.maxScore*100);
  const medal=pct>=90?'🥇':pct>=70?'🥈':pct>=50?'🥉':'🎖️';
  const msg=G.score>=50?(pct>=90?'Pesquisador(a) expert!':'Meta alcançada!'):'Abaixo da meta de 50. Tente de novo!';
  const topRanks=getRanksLocal().filter(r=>r.expId===G.expId).slice(0,5);
  const rankRows=topRanks.length?topRanks.map((r,i)=>`<div class="rank-row ${i<3?'top3':''}">
    <span style="font-size:16px;min-width:24px">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1+'º'}</span>
    <span style="font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${jq2(r.name)}</span>
    <span style="color:${EXP.color};font-weight:800">${r.score}/${r.maxScore}</span>
    <span style="color:#9e9e9e;font-size:12px">⏱️${fmtTime(r.secs)}</span>
  </div>`).join(''):'';
  R(`<div class="sc" style="background:#fafafa">
    <div style="background:${EXP.color};padding:28px 20px;text-align:center">
      <div style="font-size:56px;margin-bottom:8px">${medal}</div>
      <h2 style="font-family:'Fraunces',serif;color:white;font-size:22px;font-weight:900">${msg}</h2>
      <div style="font-size:34px;font-weight:900;color:white;margin:8px 0">${G.score}/${G.maxScore}</div>
      <div style="color:rgba(255,255,255,.75);font-size:14px">⏱️ ${fmtTime(G.elapsed)} · ${pct}%</div>
    </div>
    <div style="padding:18px;max-width:600px;margin:0 auto;width:100%">
      ${rankRows?`<div class="card" style="margin-bottom:14px">
        <div style="font-size:12px;font-weight:800;color:#616161;text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px">🏆 Top desta Expedição (local)</div>
        ${rankRows}
      </div>`:''}
      <div style="display:flex;flex-direction:column;gap:10px">
        <button class="btn" onclick="loadExp('${G.expId}')" style="background:${EXP.color};color:white;padding:14px;font-size:15px;border-radius:14px">🔄 Tentar Novamente</button>
        <button class="btn" onclick="renderHub()" style="background:#e0e0e0;color:#424242;padding:14px;font-size:15px;border-radius:14px">🏠 Hub de Expedições</button>
        <button class="btn" onclick="renderRanking()" style="background:white;color:#424242;padding:14px;font-size:15px;border-radius:14px;border:2px solid #e0e0e0">🌍 Ranking Global</button>
      </div>
    </div>
  </div>`);
}

/* ════════════════════════════════════
   RANKING SCREEN
════════════════════════════════════ */
window.renderRanking=async function(){
  R(`<div class="sc intro-bg" style="align-items:center;justify-content:center">
    <div style="text-align:center;color:#14532d;padding:40px">
      <div class="loading-ring" style="margin-bottom:12px"></div>
      <div>Carregando ranking global...</div>
    </div>
  </div>`);
  const fbData = await fbGet();
  const useGlobal = fbData && fbData.length > 0;
  const allData = useGlobal ? fbData : getRanksLocal();
  const byExp={};
  EXPEDITIONS.forEach(e=>{byExp[e.id]={title:e.title,icon:e.icon,color:e.color,rows:[]}});
  allData.forEach(r=>{if(byExp[r.expId])byExp[r.expId].rows.push(r)});
  Object.values(byExp).forEach(e=>{e.rows.sort((a,b)=>b.score!==a.score?b.score-a.score:a.secs-b.secs)});

  const tabs=EXPEDITIONS.map((e,i)=>`<button onclick="showRankTab(${i})" id="rtab${i}" class="btn" style="background:${e.color}22;color:${e.color};font-size:12px;padding:7px 12px;border-radius:20px;white-space:nowrap">${e.icon} ${e.title.split(' ').slice(0,2).join(' ')}</button>`).join('');

  const sections=EXPEDITIONS.map((e,i)=>{
    const rows=byExp[e.id].rows.slice(0,15);
    const rowsHtml=rows.length?rows.map((r,j)=>`<div class="rank-row ${j<3?'top3':''}">
      <span style="font-size:16px;min-width:26px">${j===0?'🥇':j===1?'🥈':j===2?'🥉':j+1+'º'}</span>
      <span style="font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${jq2(r.name)}</span>
      <span style="font-size:11px;color:#9e9e9e;margin-right:4px">${r.date||''}</span>
      <span style="color:${e.color};font-weight:800;min-width:58px;text-align:right">${r.score}/${r.maxScore}</span>
      <span style="color:#9e9e9e;font-size:12px;min-width:52px;text-align:right">⏱️${fmtTime(r.secs)}</span>
    </div>`).join(''):`<div style="text-align:center;color:#9e9e9e;padding:24px;font-size:14px">Nenhum resultado ainda. Seja o primeiro!</div>`;
    return `<div id="rsec${i}" style="display:${i===0?'block':'none'}">${rowsHtml}</div>`;
  }).join('');

  const source = useGlobal ? `🌍 Ranking Global · ${allData.length} resultados` : `💾 Ranking Local (Firebase não configurado)`;
  R(`<div class="sc" style="background:#fff">
    <div style="background:#f0fdf4;border-bottom:2px solid #bbf7d0;padding:20px 18px;text-align:center">
      <button class="btn" onclick="renderHub()" style="background:#fff;color:#166534;border:2px solid #bbf7d0;font-size:13px;padding:7px 14px;margin-bottom:14px">← Hub</button>
      <div style="font-size:32px">🏆</div>
      <h2 style="font-family:'Fraunces',serif;color:#14532d;font-size:22px;font-weight:900">Ranking Global</h2>
      <p style="color:#4b5d55;font-size:12px;margin-top:4px">${source}</p>
    </div>
    <div style="padding:16px 18px;max-width:700px;margin:0 auto;width:100%">
      <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px;scrollbar-width:none">
        ${tabs}
      </div>
      <div class="card">${sections}</div>
      ${!useGlobal && FB_URL?`<div style="background:#fff3e0;border-radius:12px;padding:12px 16px;margin-top:12px;font-size:13px;color:#e65100">⚠️ Não foi possível conectar ao Firebase. Mostrando ranking local.</div>`:''}
      ${!FB_URL?`<div style="background:#e3f2fd;border-radius:12px;padding:12px 16px;margin-top:12px;font-size:13px;color:#1565c0">ℹ️ Para ranking global, configure a variável FB_URL no código com seu Firebase Realtime Database.</div>`:''}
      <div style="text-align:center;margin-top:14px">
        <button class="btn" onclick="clearRanks()" style="background:#ffebee;color:#c62828;font-size:12px;padding:8px 18px">🗑️ Limpar Local</button>
      </div>
    </div>
  </div>`);
  showRankTab(0);
};

window.showRankTab=function(i){
  EXPEDITIONS.forEach((_,j)=>{
    const s=$('rsec'+j), t=$('rtab'+j);
    if(s)s.style.display=j===i?'block':'none';
    if(t){t.style.fontWeight=j===i?'800':'600';t.style.opacity=j===i?'1':'.7';}
  });
};

/* ════ BOOT ════ */
renderIntro();
</script>
</body>
</html>
